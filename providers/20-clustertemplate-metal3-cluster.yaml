# Registers the Metal3 standalone-CP ClusterTemplate with k0rdent. Must live in
# the same namespace as the ClusterDeployment that references it (kcm-system here).
apiVersion: k0rdent.mirantis.com/v1beta1
kind: ClusterTemplate
metadata:
  name: metal3-cluster-0-1-2
  namespace: kcm-system
spec:
  helm:
    chartSpec:
      chart: metal3-cluster
      version: 0.1.2
      interval: 10m0s
      sourceRef:
        kind: HelmRepository
        name: k0rdent-byo-metal3
