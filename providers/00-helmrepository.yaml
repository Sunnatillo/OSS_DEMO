# Flux source that serves the BYO charts (capm3-provider, capm3-standalone-cp)
# to k0rdent. Package and push the charts here before applying the templates:
#   helm package k0rdent/charts/capm3-provider k0rdent/charts/capm3-standalone-cp
#   helm push capm3-provider-0.1.0.tgz        oci://REGISTRY_HOST/k0rdent-byo
#   helm push capm3-standalone-cp-0.1.0.tgz   oci://REGISTRY_HOST/k0rdent-byo
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: k0rdent-byo-metal3
  namespace: kcm-system
  labels:
    k0rdent.mirantis.com/managed: "true"
spec:
  interval: 10m0s
  provider: generic
  type: oci
  # Replace REGISTRY_HOST with the lab registry reachable from the mgmt cluster.
  url: oci://REGISTRY_HOST/k0rdent-byo
