# CAPM3 needs no cloud credentials, but k0rdent's ClusterDeployment requires a
# Credential. These stub objects satisfy that requirement.
apiVersion: v1
kind: Secret
metadata:
  name: capm3-cluster-secret
  namespace: metal3
  labels:
    k0rdent.mirantis.com/component: "kcm"
type: Opaque
---
apiVersion: k0rdent.mirantis.com/v1beta1
kind: Credential
metadata:
  name: capm3-stub-credential
  namespace: metal3
spec:
  description: CAPM3 stub credential (bare metal needs no cloud identity)
  identityRef:
    apiVersion: v1
    kind: Secret
    name: capm3-cluster-secret
    namespace: metal3
