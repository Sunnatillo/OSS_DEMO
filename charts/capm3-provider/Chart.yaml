apiVersion: v2
name: capm3-provider
description: >-
  BYO k0rdent ProviderTemplate chart. Installs the Metal3 infrastructure and
  IPAM CAPI providers (and the kubeadm bootstrap/control-plane providers, which
  k0rdent does not install by default) via the Cluster API Operator.
type: application
version: 0.1.0
appVersion: "1.0.0"
annotations:
  # Providers this ProviderTemplate exposes to k0rdent.
  cluster.x-k8s.io/provider: infrastructure-metal3, ipam-metal3, bootstrap-kubeadm, control-plane-kubeadm
