# Default values for the metal3-cluster ClusterTemplate.
# k0rdent injects ClusterDeployment.spec.config over these defaults.
#
# Lab-specific defaults mirror the existing BML manifests so the chart renders
# an equivalent cluster out of the box. Override per ClusterDeployment.

# Cluster identity. Defaults to the ClusterDeployment/Release name.
clusterName: ""
# Namespace for rendered objects. Empty => follows the ClusterDeployment namespace.
namespace: ""

# Kubernetes + OS image selection. The node image is served from the httpd
# server exactly as in the imperative flow:
#   {image.baseURL}/{imageOS}_NODE_IMAGE_K8S_{k8sVersion}-raw.img
k8sVersion: v1.36.2
imageOS: CENTOS_10
image:
  baseURL: http://172.22.0.1/images
  diskFormat: raw
  checksumType: sha256

clusterNetwork:
  pods:
    - 192.168.0.0/18
  services:
    - 10.96.0.0/12

controlPlane:
  replicas: 1
  endpoint:
    host: 192.168.111.249
    port: 6443

worker:
  replicas: 1

externalDNS: 8.8.8.8

sshPublicKey: ""

ipPools:
  provisioning:
    start: 172.22.0.100
    end: 172.22.0.200
    prefix: 24
  external:
    gateway: 192.168.111.1
    start: 192.168.111.100
    end: 192.168.111.200
    prefix: 24
